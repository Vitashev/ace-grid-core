name: Contributor build
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        react: [18.2.0, 19.1.1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/react-basic/package-lock.json
      - run: npm ci
      - run: npm ci --prefix examples/react-basic
      - name: Select React runtime
        run: |
          npm install --no-save --package-lock=false react@${{ matrix.react }} react-dom@${{ matrix.react }}
          npm install --no-save --package-lock=false --prefix examples/react-basic react@${{ matrix.react }} react-dom@${{ matrix.react }}
      - run: npm run build
      - run: npm test
      - run: npm run test:types
      - run: npm run build --prefix examples/react-basic
      - run: npm run build:local --prefix examples/react-basic
